# سيرفرين من نفس الصورة، على نفس قاعدة البيانات
x-common: &common
  build: .
  restart: unless-stopped
  volumes:
    - ./data:/data
  environment:
    TZ: Africa/Cairo
    ISTAKOZA_DATA: /data

services:
  cashier:
    <<: *common
    container_name: istakoza-cashier
    environment:
      TZ: Africa/Cairo
      ISTAKOZA_DATA: /data
      ISTAKOZA_MODE: cashier
      ISTAKOZA_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/site',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backoffice:
    <<: *common
    container_name: istakoza-backoffice
    environment:
      TZ: Africa/Cairo
      ISTAKOZA_DATA: /data
      ISTAKOZA_MODE: backoffice
      ISTAKOZA_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/api/site',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      cashier:
        condition: service_healthy
